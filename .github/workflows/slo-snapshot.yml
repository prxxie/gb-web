# `US-OPS-002` — the daily SLO snapshot. A breach fails the run so it is visible in the Actions list, and a missing
# metric is rendered as a breach by the script itself (`scripts/slo-snapshot.mjs`).
name: SLO snapshot

on:
  schedule:
    - cron: "10 0 * * *" # 00:10 UTC, the window `docs/08-ops/slo.md` § 4 names
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to snapshot (YYYY-MM-DD, default: yesterday)"
        required: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Is the analytics API configured?
        id: config
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # An unconfigured repository is not a breached SLO. This job's whole value is that red means a number is bad
          # (`AC2`), and a run that goes red every morning because nobody set a secret teaches everyone to ignore it.
          # A missing *metric* still counts as a breach once the job runs (`AC3`) — that rule is in the script.
          if [ -n "$CF_ANALYTICS_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SLO snapshot skipped::CF_ANALYTICS_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set, so there is no analytics API to read. Set both (and optionally GBW_WORKER_NAME) to arm this job."
          fi

      - name: Write the snapshot
        if: steps.config.outputs.configured == 'true'
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GBW_WORKER_NAME: ${{ vars.GBW_WORKER_NAME }}
        run: |
          node scripts/slo-snapshot.mjs ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit it
        # A breach still commits the file: the evidence is the point, the red run is the alarm. `always()` is what makes
        # that true — without it a failed snapshot step skips this one and the evidence of the breach is thrown away.
        # A skipped run still commits nothing, because there is no snapshot to commit.
        if: always() && steps.config.outputs.configured == 'true'
        run: |
          git config user.name "gbw-bot"
          git config user.email "bot@gbw.local"
          git add docs/06-reports/slo-snapshots || true
          git diff --cached --quiet || git commit -m "chore(ops): daily SLO snapshot"
          git push || true
