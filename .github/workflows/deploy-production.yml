name: Deploy production

# `US-FND-004` AC2: on a merge to `main`, migrations run against the production D1 **before** the worker
# deploys, and the Pages deployment is last — so the site never points at a worker whose schema is older
# than the database. `set -e` plus separate steps means the job stops at the first failing step.
#
# The job only arms itself once the repository can actually deploy: `vars.PRODUCTION_READY` is `true` when the
# Cloudflare account, the D1 database, the Pages project and the two secrets exist. Before that, a green CI run on
# `main` used to start this job and fail on an empty `CLOUDFLARE_API_TOKEN` — a red run after every merge, which is
# how a team learns to ignore red. The variable is set when `US-FND-004` is done; `workflow_dispatch` always runs.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Absolute, not `/api/v1`: the Pages project has no function proxying the API, so a relative base would ask
  # `gbw-pages.pages.dev/api/v1/...` for a backend that is not there. It comes from the same variable the health check
  # reads, so a deploy can never build against one API and verify another.
  VITE_API_BASE: ${{ vars.PRODUCTION_API_URL }}/api/v1
  # `wrangler` reads these names; the older `CF_API_TOKEN` / `CF_ACCOUNT_ID` pair is deprecated and warns on every run.
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    name: migrations → worker → pages
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && vars.PRODUCTION_READY == 'true')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply production migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply GBW_DB --remote --env production

      - name: Deploy the production worker
        id: worker
        working-directory: apps/worker
        env:
          # The health check below greps for this sha, so the deploy has to stamp it. It is a `--var`, not a secret: a
          # secret of the same name wins over `--var` and the check would then compare against a stale manual value —
          # which is exactly how the first real run failed (`health never reported 82e93f3: version 9adfcc2`).
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --env production --var VERSION:${SHA:0:7} | tee "$RUNNER_TEMP/deploy.log"

      - name: Build the web app
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build

      - name: Deploy the Pages production branch
        # `wrangler` is a devDependency of the worker package, not of the root, so `pnpm exec wrangler` at the root fails
        # with `Command "wrangler" not found` — which is exactly how this step failed on its first real run.
        working-directory: apps/worker
        run: |
          set -euo pipefail
          pnpm exec wrangler pages deploy ../web/dist \
            --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" \
            --branch main

      # The health check is the release gate (`docs/08-ops/runbook.md` § Deploy): a worker that answers
      # with the previous sha means the deploy silently rolled back, and that must fail the job loudly.
      - name: Verify the deployed sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          API: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            body=$(curl -fsS "$API/api/v1/health" || true)
            if printf '%s' "$body" | grep -q "\"version\":\"${SHA:0:7}\""; then
              echo "health reports ${SHA:0:7}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::health never reported ${SHA:0:7}: $body"
          exit 1

      # A worker that answers with the right sha is half the release: the site the player opens is the other half. Two
      # checks, because they fail differently — the bundle on the runner proves the *build* was wired to this API
      # (`VITE_API_BASE` is baked in at build time, so a stale variable ships an app that calls the wrong backend), and the
      # network check proves *this* deployment is what Pages serves.
      - name: Verify the bundle was built against this API
        env:
          API: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -euo pipefail
          host=$(printf '%s' "$API" | sed -E 's#https?://##; s#/.*##')
          if ! grep -rl "$host" apps/web/dist/assets > /dev/null; then
            echo "::error::no built asset mentions $host - the app was built against another API"
            exit 1
          fi
          echo "the built bundle calls $host"

      - name: Verify the Pages deployment
        env:
          WEB: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          set -euo pipefail
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -fsS -o "$RUNNER_TEMP/index.html" -w '%{http_code}' "$WEB/" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$WEB/ answered ${code:-nothing}"; exit 1; }
          asset=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' "$RUNNER_TEMP/index.html" | head -1)
          [ -n "$asset" ] || { echo "::error::the page names no /assets/*.js"; exit 1; }
          curl -fsS -o /dev/null "$WEB$asset" || { echo "::error::$WEB$asset is not served"; exit 1; }
          echo "the page serves $asset"

      # A failed gate must not leave the bad version serving. No version id: the deploy this job just made is the latest
      # one, so the previous deployment is the right target.
      - name: Roll the worker back after a failed gate
        if: failure() && steps.worker.outcome == 'success'
        working-directory: apps/worker
        run: |
          set -euo pipefail
          pnpm exec wrangler rollback --env production --message "deploy-production: gate failed for ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "::warning::rolled the worker back; the Pages deployment still serves the new bundle"

