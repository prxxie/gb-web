name: CI

# `US-FND-001` AC6: a pull request with a failing test must fail the run and block the merge.
# Everything here is the same six commands `docs/01-overview/environment-setup.md` documents, so a red
# pipeline always means the documented local command is red too.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Vite reads these at build time; CI has no Clerk instance and needs none — the guest path is the default.
  VITE_API_BASE: /api/v1

jobs:
  checks:
    name: typecheck · lint · test · build · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm budget
      - run: node .agents/scripts/verify-docs.mjs

  e2e:
    name: playwright (two servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # `apps/worker/.dev.vars` is gitignored (it holds secrets), so CI writes a dummy one: the session
      # token secret only has to be non-empty for `POST /sessions` to mint a guest token.
      - name: Write CI worker env
        run: |
          printf '%s\n' \
            'SESSION_TOKEN_SECRET=ci-only-not-a-secret' \
            'ENVIRONMENT=test' \
            'ALLOWED_ORIGINS=http://127.0.0.1:5173,http://127.0.0.1:5274' \
            > apps/worker/.dev.vars
      # Both servers are started here rather than by Playwright: a CI runner has no other workload, and a
      # failing server then fails this step with its own log instead of a bare "Timed out waiting 60000ms".
      - name: Run Playwright against both servers
        env:
          E2E_SERVERS_EXTERNAL: "1"
        run: |
          set -euo pipefail
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$1"; then return 0; fi
              sleep 1
            done
            echo "::error::$1 never became available"
            return 1
          }

          pnpm dev:worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          wait_for http://127.0.0.1:8787/api/v1/health || { tail -60 "$RUNNER_TEMP/worker.log"; exit 1; }

          # `pnpm dev --port …` hands the flag to pnpm itself, which ignores it and leaves Vite on its default
          # port, so the runner reaches Vite directly through the workspace filter.
          pnpm --filter @gbw/web exec vite --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/web.log" 2>&1 &
          wait_for http://127.0.0.1:5173/ || { tail -60 "$RUNNER_TEMP/web.log"; exit 1; }

          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
